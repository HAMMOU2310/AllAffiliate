<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Statistical Transparency Index | المتجر الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-white shadow-sm py-6 text-center border-b border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800">📊 The Statistical Transparency Index</h1>
        <p class="text-sm text-gray-500 mt-2">الصدق الجذري الشامل، الممتثل للشريعة الإسلامية والشفافية الإحصائية الكاملة للمستهلك</p>
    </header>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        <input type="text" id="searchInput" placeholder="🔍 ابحث في الأرشيف الدائم عن تصنيف، اسم منتج، أو حالة الامتثال الشرعي للـ الأفلييت..." 
               class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-right bg-white text-lg">
    </div>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <h2 id="gridTitle" class="text-xl font-bold mb-6 text-gray-700 border-r-4 border-emerald-500 pr-3">🔥 أحدث التحليلات والمنتجات النشطة (تحديث تلقائي)</h2>
        
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400 mt-24">
        © 2026 Decentralized Consumer Intelligence Hub | Shariah Compliance Firewall Active.
    </footer>

    <script>
        let allProducts = [];

        async function loadStore() {
            try {
                // منع الكاش تماماً بإضافة متغير زمني فريد لضمان ظهور التحديثات فوراً
                const response = await fetch('products.json?t=' + new Date().getTime());
                const data = await response.json();
                allProducts = data.products || [];
                renderProducts(allProducts);
            } catch (error) {
                console.error("خطأ في قراءة ملف المنتجات:", error);
                document.getElementById('productsGrid').innerHTML = '<p class="text-red-500 text-center col-span-3 font-bold py-10">⚠️ خطأ: فشل جلب قاعدة البيانات الذكية. يرجى تشغيل سكريبت البايثون لتوليد ملف products.json أولاً.</p>';
            }
        }

        function renderProducts(productsList) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";
            
            if(productsList.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-center col-span-3 py-10">❌ لم يتم العثور على أي منتج متوافق في هذا الأرشيف.</p>';
                return;
            }

            productsList.forEach(prod => {
                const isRedirected = prod.status === "redirected";
                const badgeColor = isRedirected ? "bg-amber-100 text-amber-800 border-amber-200" : "bg-emerald-100 text-emerald-800 border-emerald-200";
                const shariahStatus = prod.metadata?.shariah_compliant || "Yes";

                const card = `
                    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between border-t-4 ${isRedirected ? 'border-t-amber-500' : 'border-t-emerald-500'}">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded font-semibold">${prod.category}</span>
                                <span class="text-xs px-2 py-1 rounded font-bold border ${badgeColor}">🛡️ جدار الحماية: ${shariahStatus}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mb-2">${prod.title}</h3>
                            <p class="text-sm text-gray-600 mb-4 bg-gray-50 p-2 rounded border border-gray-100">${prod.description}</p>
                            
                            <div class="text-xs mb-3 bg-red-50 p-2 rounded text-red-700 border border-red-100">
                                <strong>📊 إحصائية الشفافية (الندرة العكسية):</strong> ${prod.reverse_scarcity || 'خاضع لمراجعة الأمان العكسية.'}
                            </div>

                            <div class="text-xs text-amber-900 bg-amber-50 p-2 rounded border border-amber-200 mb-4">
                                <strong>🚫 لمن لا يصلح هذا المنتج؟</strong> ${prod.who_is_it_not_for || 'لا يصلح للباحثين عن الثراء السريع بدون جهد حقيقي.'}
                            </div>
                        </div>

                        <div class="border-t border-gray-100 pt-4 mt-2 flex justify-between items-center">
                            <span class="text-xl font-extrabold text-emerald-600">${prod.price}</span>
                            <a href="${prod.link}" target="_blank" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg font-medium hover:bg-emerald-600 transition-colors">
                                ${isRedirected ? 'عرض البديل الحلال الآمن' : 'فحص التحليل الأفلييت'}
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // محرك البحث الفوري والمستمر في الأرشيف الدائم بالكامل
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const gridTitle = document.getElementById('gridTitle');

            if (query === "") {
                gridTitle.innerText = "🔥 أحدث التحليلات والمنتجات النشطة (تحديث تلقائي)";
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(prod => 
                    prod.title.toLowerCase().includes(query) || 
                    prod.description.toLowerCase().includes(query) || 
                    prod.category.toLowerCase().includes(query) ||
                    (prod.metadata?.shariah_compliant && prod.metadata.shariah_compliant.toLowerCase().includes(query))
                );
                gridTitle.innerText = `🔍 نتائج البحث في الأرشيف الدائم (${filtered.length} منتج مكتشف)`;
                renderProducts(filtered);
            }
        });

        window.onload = loadStore;
    </script>
</body>
</html>
