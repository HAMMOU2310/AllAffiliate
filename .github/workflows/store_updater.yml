name: Auto-Update Store Database (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update_store:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run ClickBank Agent
        run: python clickbank_agent.py

      - name: Commit and Push Updates to Store
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "🤖 Smart Archive Auto-Update: Merged new trending products" || echo "No changes to commit"
          git push